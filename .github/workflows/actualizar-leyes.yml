name: Actualizar leyes desde la BCN

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días, 06:17 en Chile (horario de verano, UTC-3)
  workflow_dispatch: {}      # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-leyes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar códigos y leyes
        run: python -I herramientas/descargar_bcn.py
      - name: Guardar solo si la BCN cambió algo
        run: |
          if [ -n "$(git status --porcelain datos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos
            git commit -m "Actualizar textos desde la BCN ($(date -u +%F))"
            git push
          else
            echo "Sin cambios en la BCN."
          fi
